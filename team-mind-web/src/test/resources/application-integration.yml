spring:
  datasource:
    url: jdbc:postgresql://${IT_DB_HOST:localhost}:${IT_DB_PORT:15432}/${IT_DB_NAME:teammind}
    username: ${IT_DB_USERNAME:teammind}
    password: ${IT_DB_PASSWORD:teammind_it_password}
  data:
    redis:
      host: ${IT_REDIS_HOST:localhost}
      port: ${IT_REDIS_PORT:16379}
      password: ${IT_REDIS_PASSWORD:}

teammind:
  qdrant:
    host: ${IT_QDRANT_HOST:localhost}
    port: ${IT_QDRANT_GRPC_PORT:16334}

management:
  endpoint:
    health:
      show-details: always
