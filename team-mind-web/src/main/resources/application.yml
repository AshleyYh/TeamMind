spring:
  application:
    name: team-mind
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:teammind}
    username: ${DB_USERNAME:teammind}
    password: ${DB_PASSWORD:teammind_local_password}
    hikari:
      connection-timeout: 3000
      validation-timeout: 1000
      initialization-fail-timeout: 10000
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s
      connect-timeout: 2s
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  threads:
    virtual:
      enabled: true

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    default-enum-type-handler: org.apache.ibatis.type.EnumTypeHandler
  global-config:
    banner: false
    db-config:
      logic-delete-field: deleted
      logic-delete-value: true
      logic-not-delete-value: false

springdoc:
  api-docs:
    path: /api/v1/api-docs
  swagger-ui:
    path: /api/v1/swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  show-actuator: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
      base-path: /api/v1/actuator
  endpoint:
    health:
      show-details: when_authorized
      roles: ADMIN
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db,redis,qdrant
  health:
    qdrant:
      enabled: true
  info:
    env:
      enabled: true

info:
  application:
    name: TeamMind
    phase: Phase 2 - Basic RAG

teammind:
  qdrant:
    host: ${QDRANT_HOST:localhost}
    port: ${QDRANT_GRPC_PORT:6334}
    api-key: ${QDRANT_API_KEY:}
    use-tls: ${QDRANT_USE_TLS:false}
    request-timeout: ${QDRANT_REQUEST_TIMEOUT:10s}
    health-timeout: ${QDRANT_HEALTH_TIMEOUT:3s}
  document:
    storage-path: ${DOCUMENT_STORAGE_PATH:./data/documents}
    max-file-bytes: ${DOCUMENT_MAX_FILE_BYTES:20971520}
    chunk-tokens: ${DOCUMENT_CHUNK_TOKENS:640}
    overlap-tokens: ${DOCUMENT_OVERLAP_TOKENS:100}
    embedding-batch-size: ${DOCUMENT_EMBEDDING_BATCH_SIZE:10}
    max-chunks: ${DOCUMENT_MAX_CHUNKS:2000}
  knowledge:
    vector:
      collection: ${QDRANT_COLLECTION:team_mind_chunks}
      dimension: ${EMBEDDING_DIMENSION:1024}
      top-k: ${RAG_TOP_K:5}
      score-threshold: ${RAG_SCORE_THRESHOLD:0.25}
  ai:
    qwen:
      base-url: ${QWEN_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
      api-key: ${QWEN_API_KEY:}
      embedding-model: ${QWEN_EMBEDDING_MODEL:text-embedding-v4}
      embedding-dimension: ${EMBEDDING_DIMENSION:1024}
      chat-model: ${QWEN_CHAT_MODEL:qwen-plus}
      connect-timeout: ${QWEN_CONNECT_TIMEOUT:5s}
      read-timeout: ${QWEN_READ_TIMEOUT:60s}

logging:
  level:
    root: info
    com.teammind: info
