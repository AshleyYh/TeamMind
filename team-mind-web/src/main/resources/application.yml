spring:
  application:
    name: team-mind
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:teammind}
    username: ${DB_USERNAME:teammind}
    password: ${DB_PASSWORD:teammind_local_password}
    hikari:
      connection-timeout: 3000
      validation-timeout: 1000
      initialization-fail-timeout: 10000
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s
      connect-timeout: 2s
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  threads:
    virtual:
      enabled: true

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    default-enum-type-handler: org.apache.ibatis.type.EnumTypeHandler
  global-config:
    banner: false
    db-config:
      logic-delete-field: deleted
      logic-delete-value: true
      logic-not-delete-value: false

springdoc:
  api-docs:
    path: /api/v1/api-docs
  swagger-ui:
    path: /api/v1/swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  show-actuator: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
      base-path: /api/v1/actuator
  endpoint:
    health:
      show-details: when_authorized
      roles: ADMIN
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db,redis,qdrant
  health:
    qdrant:
      enabled: true
  info:
    env:
      enabled: true

info:
  application:
    name: TeamMind
    phase: Phase 6 - Observability

teammind:
  qdrant:
    host: ${QDRANT_HOST:localhost}
    port: ${QDRANT_GRPC_PORT:6334}
    api-key: ${QDRANT_API_KEY:}
    use-tls: ${QDRANT_USE_TLS:false}
    request-timeout: ${QDRANT_REQUEST_TIMEOUT:10s}
    health-timeout: ${QDRANT_HEALTH_TIMEOUT:3s}
  document:
    storage-path: ${DOCUMENT_STORAGE_PATH:./data/documents}
    max-file-bytes: ${DOCUMENT_MAX_FILE_BYTES:20971520}
    chunk-tokens: ${DOCUMENT_CHUNK_TOKENS:640}
    overlap-tokens: ${DOCUMENT_OVERLAP_TOKENS:100}
    embedding-batch-size: ${DOCUMENT_EMBEDDING_BATCH_SIZE:10}
    max-chunks: ${DOCUMENT_MAX_CHUNKS:2000}
  knowledge:
    vector:
      collection: ${QDRANT_COLLECTION:team_mind_chunks}
      dimension: ${EMBEDDING_DIMENSION:1024}
      top-k: ${RAG_TOP_K:5}
      score-threshold: ${RAG_SCORE_THRESHOLD:0.25}
    retrieval:
      dense-candidate-size: ${RAG_DENSE_CANDIDATE_SIZE:20}
      bm25-candidate-size: ${RAG_BM25_CANDIDATE_SIZE:20}
      rerank-candidate-size: ${RAG_RERANK_CANDIDATE_SIZE:20}
      default-strategy: ${RAG_STRATEGY:HYBRID_RERANK}
      rrf-k: ${RAG_RRF_K:60}
      max-term-count: ${RAG_MAX_TERM_COUNT:64}
      parallel-timeout: ${RAG_PARALLEL_TIMEOUT:15s}
    reranker:
      base-url: ${RERANK_BASE_URL:https://dashscope.aliyuncs.com/api/v1}
      api-key: ${RERANK_API_KEY:${QWEN_API_KEY:}}
      model: ${RERANK_MODEL:qwen3.7-text-rerank}
      instruct: ${RERANK_INSTRUCT:Given a web search query, retrieve relevant passages that answer the query.}
      connect-timeout: ${RERANK_CONNECT_TIMEOUT:5s}
      read-timeout: ${RERANK_READ_TIMEOUT:30s}
  ai:
    qwen:
      base-url: ${QWEN_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
      api-key: ${QWEN_API_KEY:}
      embedding-model: ${QWEN_EMBEDDING_MODEL:text-embedding-v4}
      embedding-dimension: ${EMBEDDING_DIMENSION:1024}
      chat-model: ${QWEN_CHAT_MODEL:qwen-plus}
      connect-timeout: ${QWEN_CONNECT_TIMEOUT:5s}
      read-timeout: ${QWEN_READ_TIMEOUT:60s}
  agent:
    # ReAct 最大模型轮数；每次工具结果回填后重新决策算一轮。
    max-iterations: ${AGENT_MAX_ITERATIONS:5}
    # 单次请求最多执行的工具调用总数，包含同一轮的并行工具调用。
    max-tool-calls: ${AGENT_MAX_TOOL_CALLS:8}
    # 连续失败达到该值后停止调用工具，改为基于已有观察生成答案。
    max-consecutive-failures: ${AGENT_MAX_CONSECUTIVE_FAILURES:3}
    max-evidence: ${AGENT_MAX_EVIDENCE:12}
    max-history-messages: ${AGENT_MAX_HISTORY_MESSAGES:20}
    max-question-length: ${AGENT_MAX_QUESTION_LENGTH:4000}
    max-observation-chars: ${AGENT_MAX_OBSERVATION_CHARS:6000}
    max-chunk-chars: ${AGENT_MAX_CHUNK_CHARS:1200}
    execution-timeout: ${AGENT_EXECUTION_TIMEOUT:90s}
    tool-timeout: ${AGENT_TOOL_TIMEOUT:20s}
  memory:
    # 短期会话消息只保存在 Redis，默认 7 天未活动自动过期。
    conversation-ttl: ${MEMORY_CONVERSATION_TTL:7d}
    max-messages: ${MEMORY_MAX_MESSAGES:200}
    # 进入提示词的最近消息数；超出的旧消息先摘要再裁剪。
    context-messages: ${MEMORY_CONTEXT_MESSAGES:20}
    summary-threshold: ${MEMORY_SUMMARY_THRESHOLD:40}
    max-summary-chars: ${MEMORY_MAX_SUMMARY_CHARS:2000}
    max-search-results: ${MEMORY_MAX_SEARCH_RESULTS:5}
    max-extraction-candidates: ${MEMORY_MAX_EXTRACTION_CANDIDATES:5}

logging:
  level:
    root: info
    com.teammind: info
